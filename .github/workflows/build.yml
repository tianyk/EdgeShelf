name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun --show-sdk-version

      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh

      - name: Self-test
        run: build/Hamster.app/Contents/MacOS/Hamster --self-test

      - name: Verify architectures
        run: |
          lipo -info build/Hamster.app/Contents/MacOS/Hamster
          ARCHS="$(lipo -archs build/Hamster.app/Contents/MacOS/Hamster)"
          echo "Built architectures: ${ARCHS}"
          echo "${ARCHS}" | grep -qw arm64
          echo "${ARCHS}" | grep -qw x86_64

      - name: Package zip and dmg
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME//\//-}"
          mkdir -p dist
          ditto -c -k --keepParent build/Hamster.app "dist/Hamster-${VERSION}.zip"
          hdiutil create \
            -volname "Hamster" \
            -srcfolder build/Hamster.app \
            -ov -format UDZO \
            "dist/Hamster-${VERSION}.dmg"
          shasum -a 256 dist/* > "dist/SHA256SUMS-${VERSION}.txt"
          ls -lh dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hamster-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS-*.txt
          generate_release_notes: true
